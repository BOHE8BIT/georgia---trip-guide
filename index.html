<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>出发！格鲁吉亚</title><style>
:root{--bg:#130d23;--bg-2:#1d1232;--card:rgba(38,25,57,.72);--card-strong:rgba(48,33,71,.86);--ink:#f3f0f8;--muted:#d7cee8;--line:rgba(184,152,217,.5);--accent:#7d52b8;--accent-2:#b898d9;--accent-3:#d4b4e8;--soft:#f3ebff;--navy:#2d1d45;--shadow:0 18px 48px rgba(9,4,20,.45)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,rgba(20,13,34,.75),rgba(16,12,27,.8)),url('https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1600&q=80') center/cover fixed no-repeat;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;line-height:1.6}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}.hero,.card,.day{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.hero{padding:26px 24px 22px;margin-bottom:26px;background:linear-gradient(135deg,rgba(90,45,130,.66),rgba(42,27,66,.75)),url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat}.top,.head,.day-head,.total{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow,.muted,.head span{font-size:12px;color:var(--muted)}h1{font-size:clamp(42px,9vw,78px);line-height:1;margin:18px 0 20px;letter-spacing:-.06em;color:#fff}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:620px}.counter{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:10px;text-align:center}.counter b{display:block;color:#fff;font-size:clamp(22px,5vw,38px)}.counter small{font-size:11px;color:var(--muted)}.head{margin:28px 2px 10px}.head h2{margin:0;font-size:clamp(21px,4vw,29px);color:#f7f1ff}.grid,.twocol{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.twocol{grid-template-columns:repeat(2,1fr)}.inner{padding:18px}.tag{display:inline-block;border-radius:999px;padding:5px 10px;background:rgba(184,152,217,.18);color:#f6ebff;border:1px solid rgba(184,152,217,.4);font-size:11px;font-weight:700}.card h3{margin:7px 0;color:#fff}.card p{margin:0;color:#f1ebf8;font-size:14px}.days{display:grid;gap:14px}.day{overflow:hidden;background:rgba(32,22,49,.68);border:1px solid rgba(184,152,217,.42)}.day-head{padding:15px 17px;cursor:pointer}.main{display:flex;align-items:center;gap:12px}.badge{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,rgba(184,152,217,.34),rgba(122,82,184,.45));color:#fff;border:1px solid rgba(184,152,217,.45);display:grid;place-items:center;font-weight:800}.title strong{display:block;line-height:1.35;color:#fff}.title small{display:block;color:#dfd4ef;font-size:12px;margin-top:3px}.toggle{border:0;background:transparent;color:var(--accent-2);font-size:22px}.body{display:none;padding:0 17px 18px}.day.open .body{display:block}.route{position:relative;padding:5px 0}.route:before{content:"";position:absolute;left:17px;top:25px;bottom:25px;border-left:2px dashed rgba(184,152,217,.38)}.stop{position:relative;display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 0}.dot{width:36px;height:36px;border-radius:50%;background:rgba(41,25,66,.9);color:#fff;display:grid;place-items:center;font-size:12px;z-index:1;border:1px solid rgba(184,152,217,.35)}.stop:first-child .dot{background:linear-gradient(135deg,#7d52b8,#B898D9)}.stop h3{margin:0;font-size:16px;color:#fff}.place{display:inline-block;color:var(--accent-3);text-decoration:underline;cursor:pointer;font-size:13px}.slot{display:block;color:var(--accent-2);font-size:11px;font-weight:700;margin-top:3px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0 48px}.map{border:1px solid rgba(184,152,217,.4);border-radius:12px;background:rgba(184,152,217,.12);color:#fff;padding:8px 10px;cursor:pointer;font:inherit;font-size:12px;font-weight:700}.map.apple{background:transparent;color:var(--ink)}.total{margin:13px 0 0 48px;padding:11px 13px;border-radius:13px;background:linear-gradient(135deg,rgba(184,152,217,.18),rgba(122,82,184,.14));border:1px solid rgba(184,152,217,.28);font-size:13px}.total strong{color:#fff}.note{margin:12px 0 0 48px;border-left:3px solid rgba(184,152,217,.6);padding-left:10px;color:#ef
