<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>出发！格鲁吉亚</title>
<style>
:root{--bg:#f4efe8;--card:#fffaf2;--text:#172131;--muted:#687386;--line:#dcd3c8;--accent:#c86f43;--soft:#efd8c7;--shadow:0 12px 34px #1b293b1d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;line-height:1.55}.wrap{max-width:980px;margin:auto;padding:18px 12px 60px}.card,.day{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}header{padding:24px;margin-bottom:22px}.eyebrow,.section-head span{font-size:12px;color:var(--muted)}h1{font-size:clamp(32px,8vw,54px);line-height:1.1;margin:10px 0}.subtitle{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 2px 9px}.section-head h2{font-size:20px;margin:0}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill,.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;color:var(--muted)}.day{overflow:hidden;margin:10px 0}.day-head{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}.badge{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-weight:800}.day-title{flex:1}.day-title strong{display:block}.day-title small{color:var(--muted)}.toggle{border:0;background:transparent;color:var(--accent);font-size:18px}.day-body{display:none;padding:0 14px 16px}.day.open .day-body{display:block}.timeline{list-style:none;margin:0;padding:0}.timeline li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.time{color:var(--muted);font-size:13px}.event b{display:block}.duration{font-size:11px;color:var(--accent);margin-left:6px}.place{display:inline-flex;align-items:center;gap:5px;margin:3px 5px 0 0;padding:5px 8px;border:1px solid var(--line);border-radius:9px;color:var(--accent);background:transparent;cursor:pointer;font:inherit;font-size:12px}.place:hover{background:var(--soft)}.map-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}.map-actions button{border:0;border-radius:10px;padding:9px 12px;background:var(--accent);color:white;cursor:pointer;font-weight:650}.map-actions button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}.note{font-size:12px;color:var(--muted);margin-top:12px}.summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff3e7;border-radius:12px;margin:12px 0}.summary strong{color:var(--accent)}@media(max-width:550px){.section-head{align-items:flex-start;flex-direction:column}.timeline li{grid-template-columns:75px 1fr}}
</style></head>
<body><main class="wrap">
<header class="card"><div class="eyebrow">此刻关注 · Couple Trip</div><h1>出发！格鲁吉亚</h1><p class="subtitle">2026.10.01–10.07 · 第比利斯 / 卡兹别克 · Asia/Tbilisi</p><div class="stats"><span class="pill">7 天 6 夜</span><span class="pill">点击地点选择地图</span><span class="pill">弹性时间制</span></div></header>
<div class="section-head"><h2>逐日行程 / Daily Plan</h2><span>上午 · 下午 · 傍晚；仅交通保留时间</span></div><section id="itinerary"></section>
<p class="note">地图按钮会根据设备打开 Apple 地图或 Google 地图；地点名称本身也可点击。行程时段为舒适的模糊安排，交通衔接和航班等必要时间会保留具体时刻。</p>
</main>
<script>
const days=[
{d:'D1',date:'10/01',title:'抵达第比利斯 / Arrive Tbilisi',sub:'机场 → 市区补给 → 接小吴',items:[['16:00','抵达第比利斯国际机场','Tbilisi International Airport','机场接送，保留具体时间以便衔接'],['傍晚','入住与补给','7 Borbalo Street, Tbilisi','放行李、附近采购，慢慢适应城市节奏'],['21:00','集合接人','Tbilisi','必要集合时间：21:00']]},
{d:'D2',date:'10/02',title:'老城与 Mtatsminda / Old Town & Funicular',sub:'咖啡 · 钟楼 · 和平桥 · 缆车',items:[['上午','咖啡与老城散步','Kvarts Coffee, Tbilisi','咖啡、定制杯和街巷拍照'],['下午','钟楼与和平桥','The Clock Tower, Tbilisi','看整点表演，沿河散步至和平桥'],['傍晚','Mtatsminda 缆车','Mtatsminda Funicular, Tbilisi','确认票价、末班车和天气后上山']]},
{d:'D3',date:'10/03',title:'第比利斯 → 卡兹别克 / Tbilisi → Kazbegi',sub:'包车日 · Ananuri · Gergeti',items:[['08:00','包车前往卡兹别克','7 Borbalo Street 7, Tbilisi','必要交通时间：08:00 出发；确认价格和停靠点'],['下午','途中停留与拍照','Ananuri Fortress, Georgia','视路况安排，不追赶景点'],['傍晚','入住 ELLO cottage','ELLO cottage Kazbegi','办理入住，确认第二天教堂安排']]},
{d:'D4',date:'10/04',title:'卡兹别克轻徒步 / Kazbegi Easy Day',sub:'河谷 · 观景 · 休息',items:[['上午','河谷轻徒步','Kazbegi Valley, Georgia','只走标记清晰、天气允许的路线'],['下午','Gergeti Trinity Church','Gergeti Trinity Church, Georgia','4x4 往返，视天气决定；不为打卡勉强出发'],['傍晚','回小屋休息','ELLO cottage Kazbegi','留出弹性时间看山景和休息']]},
{d:'D5',date:'10/05',title:'返回第比利斯 / Return to Tbilisi',sub:'早出发 · 回 Borbalo 住宿',items:[['08:30','退房并返回第比利斯','ELLO cottage Kazbegi','必要交通时间：08:30 出发'],['下午','回到公寓与自由活动','7 Borbalo Street, Tbilisi','补觉、洗衣或附近慢逛'],['傍晚','自由晚餐','Tbilisi','不固定餐厅，按体力决定']]},
{d:'D6',date:'10/06',title:'第比利斯逛吃 / Tbilisi City Day',sub:'Dry Bridge · Metekhi · 伴手礼',items:[['上午','Dry Bridge 跳蚤市场','Dry Bridge Market, Tbilisi','慢慢逛，比较价格后再购买'],['下午','Metekhi 与河景','Metekhi St. Virgin Mary Church, Tbilisi','城市与河流拍照'],['傍晚','老城晚餐与伴手礼','Tbilisi Old Town','按兴趣收尾，不安排硬性时间']]},
{d:'D7',date:'10/07',title:'机场返程 / Airport Return',sub:'老板送机 · 22:00 起飞',items:[['傍晚','前往机场','7 Borbalo Street 7, Tbilisi','送机时间按航班和路况确认'],['22:00','航班起飞','Tbilisi International Airport','必要航班时间：22:00；以机票为准']]}
];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function mapUrl(place,kind){const q=encodeURIComponent(place);return kind==='apple'?`https://maps.apple.com/?q=${q}`:`https://www.google.com/maps/search/?api=1&query=${q}`}
function openMap(place,kind){window.open(mapUrl(place,kind),'_blank','noopener,noreferrer')}
function render(){document.querySelector('#itinerary').innerHTML=days.map((day,i)=>{const places=[...new Set(day.items.map(x=>x[2]))];return `<article class="day ${i===0?'open':''}"><div class="day-head" onclick="this.parentElement.classList.toggle('open')"><span class="badge">${day.d}</span><div class="day-title"><strong>${day.date} · ${esc(day.title)}</strong><small>${esc(day.sub)}</small></div><button class="toggle" aria-label="展开或收起">⌄</button></div><div class="day-body"><ul class="timeline">${day.items.map(x=>`<li><div class="time">${esc(x[0])}</div><div class="event"><b>${esc(x[1])}<span class="duration">· 弹性安排</span></b><button class="place" onclick="openMap('${x[2].replace(/'/g,"\\'")}','google')">⌖ ${esc(x[2])}</button><p>${esc(x[3])}</p></div></li>`).join('')}</ul><div class="summary"><span>本日游玩时间总计</span><strong>约 ${Math.max(2,day.items.length*2)}–${day.items.length*3} 小时</strong></div><div class="map-actions"><span class="note">打开本日地点：</span>${places.map(p=>`<button onclick="openMap('${p.replace(/'/g,"\\'")}','apple')"> Apple 地图 · ${esc(p.split(',')[0])}</button><button class="alt" onclick="openMap('${p.replace(/'/g,"\\'")}','google')">Google 地图 · ${esc(p.split(',')[0])}</button>`).join('')}</div></div></article>`}).join('')};render();
</script></body></html>
